name: CI

on:
  push:
    branches:
      - main
      # These are the prefixes this repo actually uses. The list previously
      # read 'feature/**', which has never matched a single branch here — so
      # every feat/* and chore/* push ran no CI at all, and a branch only got
      # checked once someone opened a PR from it. Deliberately NOT '**': the
      # worktree-agent-* branches are local scratch and are not worth a run.
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build · Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Packages that ship BUILT output resolve to their dist/, which does not
      # exist on a fresh checkout. Build them before any workspace runs
      # typecheck or tests, or every consumer fails with TS2307.
      #
      # Add a package here whenever its "main" points into dist/. (@nuatis/pos-web
      # is deliberately absent: it ships source and is transpiled by Next.)
      - name: Build (packages)
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/pos-core

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      # Tests use an in-memory supabase mock — dummy values are fine.
      # AUTH_SECRET stays a real secret because JWT tests sign/verify with it.
      - name: Test
        run: npm test --workspaces --if-present
        env:
          NODE_OPTIONS: --experimental-vm-modules
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          REDIS_URL: redis://localhost:6379

      # Coverage is informational — don't fail the pipeline on a dip.
      - name: Coverage (API)
        continue-on-error: true
        run: npm run test:coverage --workspace=apps/api
        env:
          NODE_OPTIONS: --experimental-vm-modules
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 14

      - name: Build (API)
        run: npm run build --workspace=apps/api --if-present

      # Next.js reads NEXT_PUBLIC_* at build time. Provide dummy values so the
      # build doesn't crash when the real secrets are unavailable (e.g. fork PRs).
      - name: Build (Web)
        run: npm run build --workspace=apps/web --if-present
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_WEB_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: mock-vapid-public-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      # The register and the kitchen display. Their NEXT_PUBLIC_* values only
      # have to be present, not real: the pairing ids are read at build time and
      # a missing one renders the "not paired yet" screen rather than crashing.
      - name: Build (POS register)
        run: npm run build --workspace=apps/pos --if-present
        env:
          API_BACKEND_URL: http://localhost:3001
          NEXT_PUBLIC_API_ORIGIN: http://localhost:3001
          NEXT_PUBLIC_POS_TENANT_ID: 00000000-0000-0000-0000-000000000000
          NEXT_PUBLIC_POS_LOCATION_ID: 00000000-0000-0000-0000-000000000000

      - name: Build (Kitchen display)
        run: npm run build --workspace=apps/kds --if-present
        env:
          API_BACKEND_URL: http://localhost:3001
          NEXT_PUBLIC_API_ORIGIN: http://localhost:3001
          NEXT_PUBLIC_POS_TENANT_ID: 00000000-0000-0000-0000-000000000000
          NEXT_PUBLIC_POS_LOCATION_ID: 00000000-0000-0000-0000-000000000000
          NEXTAUTH_URL: http://localhost:3000

  # The workspace builds above never touch the Dockerfiles, so a package the
  # images fail to copy stays invisible until someone deploys. That gap let
  # three separate breakages sit unnoticed for a month: apps/api missing
  # packages/pos-core, apps/web missing packages/design-tokens, and tsc running
  # out of heap in the build container.
  #
  # Builds only — nothing is pushed or deployed. A separate job so it runs in
  # parallel rather than lengthening the critical path above.
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Both use the repo root as build context, the same as `az acr build`
      # does, so .dockerignore applies identically to CI and to a real deploy.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Mock values, exactly as the workspace "Build (Web)" step above uses.
      # next build evaluates server modules while collecting page data, so the
      # Supabase ones have to be present or the build fails with
      # "supabaseUrl is required". CI only proves the image builds; a deploy
      # passes the real values.
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://mock.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=mock-anon-key
            NEXT_PUBLIC_API_URL=http://localhost:3001
            SUPABASE_SERVICE_ROLE_KEY=mock-service-role-key
            AUTH_SECRET=mock-auth-secret-for-build-only-32ch
